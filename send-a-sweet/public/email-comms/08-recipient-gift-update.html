<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A surprise for you — Send a Sweet</title>
</head>
<body style="margin:0; padding:0; background-color:#fdf4e9; -webkit-font-smoothing:antialiased;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#fdf4e9;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">

          <tr>
            <td align="center" style="padding-bottom:28px;">
              <a href="{{siteUrl}}" style="text-decoration:none;"><img src="{{siteUrl}}brand/send-a-sweet-horizontal-burgundy-email.png" width="160" height="59" alt="Send a Sweet" style="display:block; width:160px; height:auto; border:0; outline:none; color:#b81d45; font-family:Georgia, serif; font-size:22px;" /></a>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-bottom:8px;">
              <p style="margin:0; font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#811c30;">
                For you
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:14px;">
              <h1 style="margin:0; font-family:'Cormorant Garamond', Cormorant, Georgia, 'Times New Roman', serif; font-size:26px; font-weight:500; line-height:1.2; color:#69192b;">
                {{recipientHeadline}}
              </h1>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;">
              <p style="margin:0; font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:16px; line-height:1.55; color:#79544e;">
                Hi {{recipientName}},<br /><br />
                {{recipientBodyCopy}}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding-bottom:28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f3e9dc; border:1px solid #d7bfb6; border-radius:16px;">
                <tr>
                  <td style="padding:20px 22px;">
                    <p style="margin:0; font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:1.55; color:#79544e;">
                      <strong style="color:#69192b;">From {{makerName}}</strong><br />
                      {{handoffHintBlock}}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding-top:8px; border-top:1px solid #d7bfb6;">
              <p style="margin:0; padding-top:20px; font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:1.5; color:#79544e;">
                <a href="{{siteUrl}}" style="color:#811c30; text-decoration:underline;">{{siteUrlDisplay}}</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
