    .toolbar label, .toolbar button, .toolbar select { font-size: 13px; }
    .toolbar button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }

    main { padding: 16px 20px 120px; max-width: 1400px; margin: 0 auto; }
    .candidate { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 18px; overflow: hidden; }
    .candidate.selected-yes { border-color: var(--yes); box-shadow: 0 0 0 1px rgba(61,214,140,.25); }
    .candidate.selected-maybe { border-color: var(--maybe); }
    .candidate.selected-no { opacity: .55; }
    .candidate.hidden { display: none; }
    .head { display: flex; gap: 14px; padding: 14px 16px; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .avatar { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: #222; flex-shrink: 0; }
    .avatar.placeholder { display: grid; place-items: center; color: var(--muted); font-size: 22px; }
    .info { flex: 1; min-width: 200px; }
    .name { font-size: 18px; font-weight: 700; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .meta a { color: #8ec5ff; }
    .pick { display: flex; gap: 6px; flex-wrap: wrap; }
    .pick button { border: 1px solid var(--border); background: #12151b; color: var(--text); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 12px; }
    .pick button.active-yes { background: rgba(61,214,140,.15); border-color: var(--yes); color: var(--yes); }
    .pick button.active-maybe { background: rgba(255,176,32,.12); border-color: var(--maybe); color: var(--maybe); }
    .pick button.active-no { background: rgba(255,107,107,.12); border-color: var(--no); color: var(--no); }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 12px; }
    .shot { position: relative; aspect-ratio: 4/3; background: #0b0d11; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); cursor: zoom-in; }
    .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .shot .remote { position: absolute; bottom: 6px; right: 6px; font-size: 10px; background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 4px; color: #ccc; }
    .empty { padding: 20px 16px; color: var(--muted); font-size: 14px; }
    .links { padding: 0 16px 12px; font-size: 12px; }
    .links a { color: #8ec5ff; margin-right: 10px; }
    .cover { font-size: 12px; color: #b8c0cc; margin: 0 16px 10px; line-height: 1.45; border-left: 3px solid var(--border); padding-left: 10px; }
    .notes { font-size: 12px; color: #888; margin: 0 16px 12px; font-style: italic; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
    .badge.high { background: rgba(61,214,140,.15); color: var(--yes); }
    .badge.medium { background: rgba(255,176,32,.12); color: var(--maybe); }
    .badge.low, .badge.none { background: rgba(255,107,107,.1); color: #f99; }
    #shortlistPanel { position: fixed; bottom: 0; left: 0; right: 0; background: #12151b; border-top: 1px solid var(--border); padding: 10px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; z-index: 30; }
    #shortlistPanel .list { flex: 1; font-size: 13px; color: var(--muted); min-width: 200px; }
    #shortlistPanel strong { color: var(--yes); }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50; align-items: center; justify-content: center; padding: 20px; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: min(1200px, 96vw); max-height: 90vh; border-radius: 8px; }

    const STORAGE_KEY = 'upwork-portfolio-picks-2095961518096053621';

    function allLinks(a) {
      return [...(a.cover_letter_links||[]), ...(a.web_links||[])];
    }

    function render() {
      const main = document.getElementById('main');
      const onlyWork = document.getElementById('onlyWithWork').checked;
      const onlyPicked = document.getElementById('onlyPicked').checked;
      const conf = document.getElementById('filterConfidence').value;
      main.innerHTML = '';

      let yes=0, maybe=0, no=0, visible=0;
      for (const a of DATA.applicants) {
        const pick = picks[a.index] || '';
        if (pick === 'yes') yes++; else if (pick === 'maybe') maybe++; else if (pick === 'no') no++;
        const hasWork = (a.images && a.images.length) || (a.remote_images && a.remote_images.length);
        if (onlyWork && !hasWork) continue;
        if (onlyPicked && pick !== 'yes' && pick !== 'maybe') continue;
        if (conf === 'high' && a.confidence !== 'high') continue;
        if (conf === 'medium' && !['high','medium'].includes(a.confidence)) continue;
        visible++;

        const card = document.createElement('section');
        card.className = 'candidate' + (pick ? ' selected-' + pick : '');
        card.dataset.index = a.index;

        const imgs = [
          ...(a.images||[]).map(x => ({ src: x.file, remote: false })),
          ...(a.remote_images||[]).slice(0,4).map(x => ({ src: x.image_url, remote: true }))
        ];

        card.innerHTML = `
          <div class="head">
            ${a.headshot
              ? `<img class="avatar" src="${a.headshot}" alt="${a.name}">`
              : `<div class="avatar placeholder">👤</div>`}
            <div class="info">
              <div class="name">${a.index}. ${a.name}
                <span class="badge ${a.confidence}">${a.confidence}</span>
              </div>
              <div class="meta">
                ${a.bid ? a.bid + ' · ' : ''}
                <a href="${a.upwork}" target="_blank">Upwork profile</a>
                · ${imgs.length} work image(s)
              </div>
            </div>
            <div class="pick">
              <button type="button" data-pick="yes" class="${pick==='yes'?'active-yes':''}">✓ Yes</button>
              <button type="button" data-pick="maybe" class="${pick==='maybe'?'active-maybe':''}">? Maybe</button>
              <button type="button" data-pick="no" class="${pick==='no'?'active-no':''}">✗ No</button>
            </div>
          </div>
          ${imgs.length ? `<div class="gallery">${imgs.map(i => `
            <div class="shot" data-src="${i.src}">
              <img src="${i.src}" loading="lazy" alt="${a.name} portfolio" />
              ${i.remote ? '<span class="remote">remote</span>' : ''}
            </div>`).join('')}</div>` : `<div class="empty">No portfolio images scraped — check external links below.</div>`}
            ${allLinks(a).length ? `<div class="links">${allLinks(a).slice(0,6).map(u => `<a href="${u}" target="_blank">${new URL(u).hostname}</a>`).join('')}</div>` : ''}
            ${a.cover_snippet ? `<div class="cover">${a.cover_snippet}${a.cover_snippet.length>=280?'…':''}</div>` : ''}
            ${a.notes ? `<div class="notes">${a.notes}</div>` : ''}
        `;

        card.querySelectorAll('.pick button').forEach(btn => {
          btn.addEventListener('click', () => {
            const val = btn.dataset.pick;
            picks[a.index] = picks[a.index] === val ? '' : val;
            if (!picks[a.index]) delete picks[a.index];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
            render();
          });
        });
        card.querySelectorAll('.shot').forEach(el => {
          el.addEventListener('click', () => openLightbox(el.dataset.src));
        });
        main.appendChild(card);
      }

      document.getElementById('counts').textContent =
        `${visible} shown · ${yes} yes · ${maybe} maybe · ${no} no`;

      const yesList = DATA.applicants.filter(a => picks[a.index]==='yes').map(a => a.index + '. ' + a.name);
      const maybeList = DATA.applicants.filter(a => picks[a.index]==='maybe').map(a => a.index + '. ' + a.name);
      document.getElementById('shortlistSummary').innerHTML =
        yesList.length || maybeList.length
          ? `<strong>Yes (${yesList.length}):</strong> ${yesList.join(', ') || '—'}
             ${maybeList.length ? ' · <strong>Maybe ('+maybeList.length+'):</strong> ' + maybeList.join(', ') : ''}`
          : 'Pick Yes or Maybe on candidates you want to keep.';
    }

    function openLightbox(src) {
      document.getElementById('lbImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    document.getElementById('lbClose').onclick = () => document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox').onclick = (e) => { if (e.target.id==='lightbox') e.currentTarget.classList.remove('open'); };

    function exportShortlist() {
      const lines = ['SHORTLIST — ' + DATA.job_title, ''];
      for (const tier of ['yes','maybe']) {
        const label = tier === 'yes' ? 'YES' : 'MAYBE';
        lines.push(label + ':');
        for (const a of DATA.applicants.filter(x => picks[x.index]===tier)) {
          lines.push('- ' + a.index + '. ' + a.name + ' (' + (a.bid||'') + ') ' + a.upwork);
        }
        lines.push('');
      }
      navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Shortlist copied to clipboard'));
    }

    ['onlyWithWork','onlyPicked','filterConfidence'].forEach(id =>
      document.getElementById(id).addEventListener('change', render));
    document.getElementById('exportBtn').onclick = exportShortlist;
    document.getElementById('exportBtn2').onclick = exportShortlist;
    document.getElementById('clearBtn').onclick = () => {
      if (confirm('Clear all picks?')) { picks = {}; localStorage.removeItem(STORAGE_KEY); render(); }
    };
    render();
  </script>
</body>
</html>
