<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Interior designers</title>
  <style>
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e8e6e1;
      --yes: #1b7f5a;
      --yes-bg: #e8f5ef;
      --maybe: #b45309;
      --maybe-bg: #fef3e2;
      --no: #9ca3af;
      --no-bg: #f3f4f6;
      --accent: #1a1a1a;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(72px + var(--safe-b));
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(250,249,247,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: calc(12px + var(--safe-t)) 16px 12px;
    }
    .brand { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 4px 0 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    .stats { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .stat {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .stat strong { color: var(--text); font-weight: 600; }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card.pick-yes { border-color: #9fd4bc; box-shadow: 0 0 0 1px #9fd4bc; }
    .card.pick-maybe { border-color: #f0c987; box-shadow: 0 0 0 1px #f0c987; }
    .card.pick-no { opacity: .72; }
    .card.hidden { display: none; }
    .card-head {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      padding: 14px 14px 10px;
      align-items: center;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--line);
    }
    .avatar.ph {
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .name { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
    .subline { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .links a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
    }
    .picks {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 14px 14px;
    }
    .pick {
      border: 0;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg);
      color: var(--muted);
      min-height: 44px;
    }
    .pick.yes.on { background: var(--yes-bg); color: var(--yes); }
    .pick.maybe.on { background: var(--maybe-bg); color: var(--maybe); }
    .pick.no.on { background: var(--no-bg); color: #6b7280; }
    .gallery-wrap { padding: 0 0 14px; }
    .gallery-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding: 0 14px 8px;
    }
    .gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 14px 4px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .thumb {
      flex: 0 0 72%;
      max-width: 280px;
      scroll-snap-align: start;
      border: 0;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--line);
      aspect-ratio: 4/3;
      cursor: pointer;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .assess {
      margin: 0 14px 12px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .assess-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .assess-rank { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .assess-index { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
    .assess-index small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
    .assess-dims { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
    .dim { font-size: 11px; color: var(--muted); line-height: 1.25; }
    .dim-bar { display: flex; gap: 2px; margin-top: 3px; }
    .dim-bar i { flex: 1; height: 5px; border-radius: 2px; background: var(--line); }
    .dim-bar i.on { background: var(--accent); }
    .dim.absent .dim-bar i.on { background: #c4c0b8; }
    .assess-pattern { font-size: 12px; color: var(--text); margin-top: 10px; line-height: 1.4; }
    .assess-pattern span { color: var(--muted); }
    .assess-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .assess-tags b {
      font-weight: 500; font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line); color: var(--muted);
    }
    .assess-tags b.warn { background: var(--maybe-bg); color: var(--maybe); border-color: #f0c987; }
    .assess-tags b.good { background: var(--yes-bg); color: var(--yes); border-color: #9fd4bc; }
    .assess-note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    .cohort-note { font-size: 12px; color: var(--muted); padding: 0 16px 8px; }
    .empty-work {
      margin: 0 14px 14px;
      padding: 20px 14px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--bg);
      border-radius: 12px;
      border: 1px dashed var(--line);
    }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 10px 16px calc(10px + var(--safe-b));
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dock-summary {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    .dock-summary strong { color: var(--yes); font-weight: 600; }
    .dock button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      min-height: 44px;
    }
    .dock button.ghost {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
    }
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.94);
      flex-direction: column;
      padding: var(--safe-t) 0 var(--safe-b);
    }
    #lightbox.open { display: flex; }
    .lb-top {
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px;
    }
    .lb-close {
      border: 0;
      background: rgba(255,255,255,.15);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }
    .lb-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      min-height: 0;
    }
    .lb-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(80px + var(--safe-b));
      transform: translateX(-50%) translateY(12px);
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (min-width: 720px) {
      body { padding-bottom: 80px; }
      main { max-width: 720px; margin: 0 auto; }
      .top, .filters { padding-left: max(16px, calc(50% - 360px)); padding-right: max(16px, calc(50% - 360px)); }
      .dock > * { max-width: 720px; margin: 0 auto; width: 100%; }
      .thumb { flex-basis: 220px; max-width: 220px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Praxis</div>
    <h1>Interior designers</h1>
    <div class="stats" id="stats"></div>

  <div class="cohort-note">Top 5 of 24 scored candidates (27 submitted). Index is the mean of nine cognitive readings on a 1–5 anchor scale, equal weights. Not a validated hirability score.</div>
  <div class="filters" id="filters">

  <main id="main"></main>
  <div class="dock">
    <div class="dock-summary" id="dockSummary">Tap Yes or Maybe to build your shortlist.</div>
    <button type="button" class="ghost" id="clearBtn" hidden>Clear</button>
    <button type="button" id="copyBtn">Copy list</button>
  </div>
  <div id="lightbox" aria-hidden="true">
    <div class="lb-top"><button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button></div>
    <div class="lb-stage"><img id="lbImg" alt="" /></div>
  </div>
  <div class="toast" id="toast">Copied</div>

ent": false}, {"id": "C7", "label": "Tool orchestration", "score": 1.0, "absent": true}, {"id": "C8", "label": "Explanatory clarity", "score": 4.0, "absent": false}, {"id": "C9", "label": "Claim–action coherence", "score": 3.0, "absent": true}], "strongest": ["Problem framing", "Structural decomposition"], "weakest": ["Tool orchestration", "Claim–action coherence"], "ownWords": 93, "readsScript": false, "aiUsed": false, "minutes": 10, "absent": ["Tool orchestration", "Claim–action coherence"]}}, {"id": 6, "name": "Muhammad H.", "headshot": "portfolio-work/06__muhammad-h/headshot.jpg", "rate": "$25.0", "images": ["portfolio-work/06__muhammad-h/bh01.png", "portfolio-work/06__muhammad-h/bh02.webp", "portfolio-work/06__muhammad-h/bh03.webp", "portfolio-work/06__muhammad-h/bh04.webp", "portfolio-work/06__muhammad-h/bh05.webp", "portfolio-work/06__muhammad-h/bh06.webp", "portfolio-work/06__muhammad-h/bh07.webp", "portfolio-work/06__muhammad-h/bh08.webp", "portfolio-work/06__muhammad-h/bh09.webp", "portfolio-work/06__muhammad-h/bh10.webp", "portfolio-work/06__muhammad-h/bh11.webp", "portfolio-work/06__muhammad-h/bh12.webp"], "links": [{"url": "https://www.behance.net/mhuzaifam", "label": "Behance"}], "hasWork": true, "assessment": {"rank": 3, "case": "TBVSFH", "fullName": "Muhammad Huzaifah", "index": 3.33, "dims": [{"id": "C1", "label": "Problem framing", "score": 4.0, "absent": false}, {"id": "C2", "label": "Structural decomposition", "score": 3.0, "absent": false}, {"id": "C3", "label": "Constraint & tradeoff", "score": 3.0, "absent": false}, {"id": "C4", "label": "Justification depth", "score": 3.0, "absent": false}, {"id": "C5", "label": "Handling uncertainty", "score": 4.0, "absent": false}, {"id": "C6", "label": "Self-correction", "score": 2.0, "absent": false}, {"id": "C7", "label": "Tool orchestration", "score": 3.0, "absent": false}, {"id": "C8", "label": "Explanatory clarity", "score": 4.0, "absent": false}, {"id": "C9", "label": "Claim–action coherence", "score": 4.0, "absent": false}], "strongest": ["Problem framing", "Handling uncertainty"], "weakest": ["Self-correction", "Tool orchestration"], "ownWords": 91, "readsScript": false, "aiUsed": true, "minutes": 15, "absent": []}}, {"id": 26, "name": "Egla X.", "headshot": "portfolio-work/26__egla-x/headshot.jpg", "rate": "$25.0", "images": [], "links": [], "hasWork": false, "assessment": {"rank": 4, "case": "VDUSU6", "fullName": "Egla Xhaferri", "index": 3.33, "dims": [{"id": "C1", "label": "Problem framing", "score": 4.0, "absent": false}, {"id": "C2", "label": "Structural decomposition", "score": 4.0, "absent": false}, {"id": "C3", "label": "Constraint & tradeoff", "score": 3.0, "absent": false}, {"id": "C4", "label": "Justification depth", "score": 3.0, "absent": false}, {"id": "C5", "label": "Handling uncertainty", "score": 4.0, "absent": false}, {"id": "C6", "label": "Self-correction", "score": 2.0, "absent": false}, {"id": "C7", "label": "Tool orchestration", "score": 2.0, "absent": false}, {"id": "C8", "label": "Explanatory clarity", "score": 4.0, "absent": false}, {"id": "C9", "label": "Claim–action coherence", "score": 4.0, "absent": false}], "strongest": ["Problem framing", "Structural decomposition"], "weakest": ["Tool orchestration", "Self-correction"], "ownWords": 100, "readsScript": false, "aiUsed": false, "minutes": 15, "absent": []}}, {"id": 16, "name": "Toymur A.", "headshot": "portfolio-work/16__toymur-a/headshot.jpg", "rate": "$15", "images": ["portfolio-work/16__toymur-a/bh01.webp", "portfolio-work/16__toymur-a/bh02.webp", "portfolio-work/16__toymur-a/bh03.webp", "portfolio-work/16__toymur-a/bh04.webp", "portfolio-work/16__toymur-a/bh05.webp", "portfolio-work/16__toymur-a/bh06.webp", "portfolio-work/16__toymur-a/bh07.webp", "portfolio-work/16__toymur-a/bh08.webp", "portfolio-work/16__toymur-a/bh09.webp", "portfolio-work/16__toymur-a/bh10.webp", "portfolio-work/16__toymur-a/bh11.webp", "portfolio-work/16__toymur-a/bh12.webp"], "links": [{"url": "https://www.behance.net/onestepinterior", "label": "Behance"}], "hasWork": true, "assessment": {"rank": 5, "case": "Q4DBRQ", "fullName": "Toymur Ahmed", "index": 2.67, "dims": [{"id": "C1", "label": "Problem framing", "score": 2.0, "absent": false}, {"id": "C2", "label": "Structural decomposition", "score": 2.0, "absent": false}, {"id": "C3", "label": "Constraint & tradeoff", "score": 2.0, "absent": false}, {"id": "C4", "label": "Justification depth", "score": 2.0, "absent": false}, {"id": "C5", "label": "Handling uncertainty", "score": 3.0, "absent": false}, {"id": "C6", "label": "Self-correction", "score": 3.0, "absent": false}, {"id": "C7", "label": "Tool orchestration", "score": 2.0, "absent": false}, {"id": "C8", "label": "Explanatory clarity", "score": 3.0, "absent": false}, {"id": "C9", "label": "Claim–action coherence", "score": 5.0, "absent": false}], "strongest": ["Claim–action coherence", "Handling uncertainty"], "weakest": ["Tool orchestration", "Justification depth"], "ownWords": 96, "readsScript": false, "aiUsed": false, "minutes": 15, "absent": []}}], "cohort": {"assessed": 24, "submitted": 27}};
    const STORAGE_KEY = 'praxis-interior-designer-picks';
    let picks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let activeFilter = 'all';

    function initials(name) {
      return name.split(/\s+/).map(p => p[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
    }

    function renderAssessment(s) {
      const dims = s.dims.map(d =>
        '<div class="dim' + (d.absent ? ' absent' : '') + '">' + d.label + (d.absent ? ' °' : '') +
        '<div class="dim-bar">' + [1,2,3,4,5].map(n => '<i class="' + (n <= d.score ? 'on' : '') + '"></i>').join('') + '</div></div>'
      ).join('');
      const tags = [
        '<b>' + s.minutes + ' min session</b>',
        '<b class="' + (s.ownWords >= 90 ? 'good' : '') + '">' + s.ownWords + '% own words</b>',
        s.aiUsed ? '<b>Used AI</b>' : '<b>No AI used</b>',
        s.readsScript ? '<b class="warn">Reads a script</b>' : ''
      ].join('');
      const note = s.absent.length
        ? '<div class="assess-note">° No evidence observed for ' + s.absent.join(' and ') + '; scored as absence, not as a low reading.</div>'
        : '';
      return '<div class="assess">' +
        '<div class="assess-top"><div class="assess-rank">#' + s.rank + ' of 24 assessed · case ' + s.case + '</div>' +
        '<div class="assess-index">' + s.index.toFixed(2) + '<small>/ 5</small></div></div>' +
        '<div class="assess-dims">' + dims + '</div>' +
        '<div class="assess-pattern"><span>Strongest</span> ' + s.strongest.join(', ') + ' &nbsp;·&nbsp; <span>Weakest</span> ' + s.weakest.join(', ') + '</div>' +
        '<div class="assess-tags">' + tags + '</div>' +
        '</div>';
    }

    function setPick(id, val) {
      if (picks[id] === val) delete picks[id];
      else picks[id] = val;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
      render();
    }

    function matchesFilter(a) {
      const p = picks[a.id] || '';
      if (activeFilter === 'work') return a.hasWork;
      if (activeFilter === 'yes') return p === 'yes';
      if (activeFilter === 'maybe') return p === 'maybe';
      if (activeFilter === 'undecided') return !p;
      return true;
    }

    function render() {
      const main = document.getElementById('main');
      main.innerHTML = '';
      let yes = 0, maybe = 0, no = 0, shown = 0;
      for (const a of DATA.applicants) {
        const p = picks[a.id] || '';
        if (p === 'yes') yes++;
        else if (p === 'maybe') maybe++;
        else if (p === 'no') no++;
        if (!matchesFilter(a)) continue;
        shown++;

        const card = document.createElement('article');
        card.className = 'card' + (p ? ' pick-' + p : '');
        card.innerHTML = `
          <div class="card-head">
            ${a.headshot
              ? '<img class="avatar" src="' + a.headshot + '" alt="">'
              : '<div class="avatar ph">' + initials(a.name) + '</div>'}
            <div>
              <div class="name">${a.name}</div>
              <div class="subline">${a.rate ? a.rate + '/hr · ' : ''}${a.images.length ? a.images.length + ' photos' : 'No photos yet'}</div>
              ${a.links.length ? '<div class="links">' + a.links.map(l =>
                '<a href="' + l.url + '" target="_blank" rel="noopener">' + l.label + '</a>').join('') + '</div>' : ''}
            </div>
          </div>
          ${a.assessment ? renderAssessment(a.assessment) : ''}
          <div class="picks">
            <button type="button" class="pick yes ${p==='yes'?'on':''}" data-pick="yes">Yes</button>
            <button type="button" class="pick maybe ${p==='maybe'?'on':''}" data-pick="maybe">Maybe</button>
            <button type="button" class="pick no ${p==='no'?'on':''}" data-pick="no">Pass</button>
          </div>
          ${a.images.length
            ? '<div class="gallery-wrap"><div class="gallery-label">Portfolio</div><div class="gallery">' +
              a.images.map(src => '<button type="button" class="thumb" data-src="' + src + '"><img src="' + src + '" loading="lazy" alt=""></button>').join('') +
              '</div></div>'
            : '<div class="empty-work">No portfolio images on file</div>'}
        `;

        card.querySelectorAll('.pick').forEach(btn => {
          btn.addEventListener('click', () => setPick(a.id, btn.dataset.pick));
        });
        card.querySelectorAll('.thumb').forEach(btn => {
          btn.addEventListener('click', () => openLightbox(btn.dataset.src));
        });
        main.appendChild(card);
      }

      document.getElementById('stats').innerHTML =
        '<span class="stat"><strong>' + shown + '</strong> shown</span>' +
        '<span class="stat"><strong>' + yes + '</strong> yes</span>' +
        '<span class="stat"><strong>' + maybe + '</strong> maybe</span>';

      const yesNames = DATA.applicants.filter(a => picks[a.id]==='yes').map(a => a.name);
      const maybeNames = DATA.applicants.filter(a => picks[a.id]==='maybe').map(a => a.name);
      const parts = [];
      if (yesNames.length) parts.push('<strong>Yes (' + yesNames.length + '):</strong> ' + yesNames.join(', '));
      if (maybeNames.length) parts.push('<strong>Maybe (' + maybeNames.length + '):</strong> ' + maybeNames.join(', '));
      document.getElementById('dockSummary').innerHTML = parts.length
        ? parts.join(' · ')
        : 'Tap Yes or Maybe to build your shortlist.';
      document.getElementById('clearBtn').hidden = !(yes || maybe || no);
    }

    function openLightbox(src) {
      document.getElementById('lbImg').src = src;
      document.getElementById('lightbox').classList.add('open');
      document.getElementById('lightbox').setAttribute('aria-hidden', 'false');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightbox').setAttribute('aria-hidden', 'true');
      document.getElementById('lbImg').src = '';
    }
    document.getElementById('lbClose').onclick = closeLightbox;
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function copyShortlist() {
      const lines = [DATA.title, ''];
      const yes = DATA.applicants.filter(a => picks[a.id]==='yes');
      const maybe = DATA.applicants.filter(a => picks[a.id]==='maybe');
      if (yes.length) {
        lines.push('YES:');
        yes.forEach(a => lines.push('- ' + a.name + (a.rate ? ' (' + a.rate + '/hr)' : '')));
        lines.push('');
      }
      if (maybe.length) {
        lines.push('MAYBE:');
        maybe.forEach(a => lines.push('- ' + a.name + (a.rate ? ' (' + a.rate + '/hr)' : '')));
      }
      const text = lines.join('\n').trim();
      if (!text || (!yes.length && !maybe.length)) {
        showToast('Nothing to copy yet');
        return;
      }
      navigator.clipboard.writeText(text).then(() => showToast('Shortlist copied'));
    }

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
        chip.classList.add('on');
        activeFilter = chip.dataset.filter;
        render();
      });
    });
    document.getElementById('copyBtn').onclick = copyShortlist;
    document.getElementById('clearBtn').onclick = () => {
      if (confirm('Clear all picks?')) {
        picks = {};
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    };
    render();
  </script>
</body>
</html>
