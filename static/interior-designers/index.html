<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Interior designers</title>
  <style>
    :root {
      --bg: #faf9f7;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --line: #e8e6e1;
      --yes: #1b7f5a;
      --yes-bg: #e8f5ef;
      --maybe: #b45309;
      --maybe-bg: #fef3e2;
      --no: #9ca3af;
      --no-bg: #f3f4f6;
      --accent: #1a1a1a;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: calc(72px + var(--safe-b));
    }
    .top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(250,249,247,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: calc(12px + var(--safe-t)) 16px 12px;
    }
    .brand { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 4px 0 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    .stats { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .stat {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .stat strong { color: var(--text); font-weight: 600; }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card.pick-yes { border-color: #9fd4bc; box-shadow: 0 0 0 1px #9fd4bc; }
    .card.pick-maybe { border-color: #f0c987; box-shadow: 0 0 0 1px #f0c987; }
    .card.pick-no { opacity: .72; }
    .card.hidden { display: none; }
    .card-head {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      padding: 14px 14px 10px;
      align-items: center;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--line);
    }
    .avatar.ph {
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 600;
      color: var(--muted);
    }
    .name { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
    .subline { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .links a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--line);
    }
    .picks {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 14px 14px;
    }
    .pick {
      border: 0;
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg);
      color: var(--muted);
      min-height: 44px;
    }
    .pick.yes.on { background: var(--yes-bg); color: var(--yes); }
    .pick.maybe.on { background: var(--maybe-bg); color: var(--maybe); }
    .pick.no.on { background: var(--no-bg); color: #6b7280; }
    .gallery-wrap { padding: 0 0 14px; }
    .gallery-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      padding: 0 14px 8px;
    }
    .gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 14px 4px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .thumb {
      flex: 0 0 72%;
      max-width: 280px;
      scroll-snap-align: start;
      border: 0;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      background: var(--line);
      aspect-ratio: 4/3;
      cursor: pointer;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .empty-work {
      margin: 0 14px 14px;
      padding: 20px 14px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--bg);
      border-radius: 12px;
      border: 1px dashed var(--line);
    }
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 10px 16px calc(10px + var(--safe-b));
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dock-summary {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    .dock-summary strong { color: var(--yes); font-weight: 600; }
    .dock button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      min-height: 44px;
    }
    .dock button.ghost {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
    }
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.94);
      flex-direction: column;
      padding: var(--safe-t) 0 var(--safe-b);
    }
    #lightbox.open { display: flex; }
    .lb-top {
      display: flex;
      justify-content: flex-end;
      padding: 12px 16px;
    }
    .lb-close {
      border: 0;
      background: rgba(255,255,255,.15);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 22px;
      cursor: pointer;
    }
    .lb-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      min-height: 0;
    }
    .lb-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(80px + var(--safe-b));
      transform: translateX(-50%) translateY(12px);
      background: var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (min-width: 720px) {
      body { padding-bottom: 80px; }
      main { max-width: 720px; margin: 0 auto; }
      .top, .filters { padding-left: max(16px, calc(50% - 360px)); padding-right: max(16px, calc(50% - 360px)); }
      .dock > * { max-width: 720px; margin: 0 auto; width: 100%; }
      .thumb { flex-basis: 220px; max-width: 220px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Praxis</div>
    <h1>Interior designers</h1>
    <div class="stats" id="stats"></div>
  </header>
  <div class="filters" id="filters">
    <button type="button" class="chip on" data-filter="all">All</button>

    <button type="button" class="chip" data-filter="maybe">Maybe</button>

  <main id="main"></main>
  <div class="dock">

    <button type="button" class="ghost" id="clearBtn" hidden>Clear</button>
    <button type="button" id="copyBtn">Copy list</button>
  </div>
  <div id="lightbox" aria-hidden="true">
    <div class="lb-top"><button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button></div>
    <div class="lb-stage"><img id="lbImg" alt="" /></div>
  </div>
  <div class="toast" id="toast">Copied</div>

    const STORAGE_KEY = 'praxis-interior-designer-picks';
    let picks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    let activeFilter = 'all';

    function initials(name) {
      return name.split(/\s+/).map(p => p[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
    }

    function setPick(id, val) {
      if (picks[id] === val) delete picks[id];
      else picks[id] = val;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(picks));
      render();
    }

    function matchesFilter(a) {
      const p = picks[a.id] || '';
      if (activeFilter === 'work') return a.hasWork;
      if (activeFilter === 'yes') return p === 'yes';
      if (activeFilter === 'maybe') return p === 'maybe';
      if (activeFilter === 'undecided') return !p;
      return true;
    }

    function render() {
      const main = document.getElementById('main');
      main.innerHTML = '';
      let yes = 0, maybe = 0, no = 0, shown = 0;
      for (const a of DATA.applicants) {
        const p = picks[a.id] || '';
        if (p === 'yes') yes++;
        else if (p === 'maybe') maybe++;
        else if (p === 'no') no++;
        if (!matchesFilter(a)) continue;
        shown++;

        const card = document.createElement('article');
        card.className = 'card' + (p ? ' pick-' + p : '');
        card.innerHTML = `
          <div class="card-head">
            ${a.headshot
              ? '<img class="avatar" src="' + a.headshot + '" alt="">'
              : '<div class="avatar ph">' + initials(a.name) + '</div>'}
            <div>
              <div class="name">${a.name}</div>
              <div class="subline">${a.rate ? a.rate + '/hr · ' : ''}${a.images.length ? a.images.length + ' photos' : 'No photos yet'}</div>
              ${a.links.length ? '<div class="links">' + a.links.map(l =>
                '<a href="' + l.url + '" target="_blank" rel="noopener">' + l.label + '</a>').join('') + '</div>' : ''}
            </div>
          </div>
          <div class="picks">
            <button type="button" class="pick yes ${p==='yes'?'on':''}" data-pick="yes">Yes</button>
            <button type="button" class="pick maybe ${p==='maybe'?'on':''}" data-pick="maybe">Maybe</button>
            <button type="button" class="pick no ${p==='no'?'on':''}" data-pick="no">Pass</button>
          </div>
          ${a.images.length
            ? '<div class="gallery-wrap"><div class="gallery-label">Portfolio</div><div class="gallery">' +
              a.images.map(src => '<button type="button" class="thumb" data-src="' + src + '"><img src="' + src + '" loading="lazy" alt=""></button>').join('') +
              '</div></div>'
            : '<div class="empty-work">No portfolio images on file</div>'}
        `;

        card.querySelectorAll('.pick').forEach(btn => {
          btn.addEventListener('click', () => setPick(a.id, btn.dataset.pick));
        });
        card.querySelectorAll('.thumb').forEach(btn => {
          btn.addEventListener('click', () => openLightbox(btn.dataset.src));
        });
        main.appendChild(card);
      }

      document.getElementById('stats').innerHTML =
        '<span class="stat"><strong>' + shown + '</strong> shown</span>' +
        '<span class="stat"><strong>' + yes + '</strong> yes</span>' +
        '<span class="stat"><strong>' + maybe + '</strong> maybe</span>';

      const yesNames = DATA.applicants.filter(a => picks[a.id]==='yes').map(a => a.name);
      const maybeNames = DATA.applicants.filter(a => picks[a.id]==='maybe').map(a => a.name);
      const parts = [];
      if (yesNames.length) parts.push('<strong>Yes (' + yesNames.length + '):</strong> ' + yesNames.join(', '));
      if (maybeNames.length) parts.push('<strong>Maybe (' + maybeNames.length + '):</strong> ' + maybeNames.join(', '));
      document.getElementById('dockSummary').innerHTML = parts.length
        ? parts.join(' · ')
        : 'Tap Yes or Maybe to build your shortlist.';
      document.getElementById('clearBtn').hidden = !(yes || maybe || no);
    }

    function openLightbox(src) {
      document.getElementById('lbImg').src = src;
      document.getElementById('lightbox').classList.add('open');
      document.getElementById('lightbox').setAttribute('aria-hidden', 'false');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightbox').setAttribute('aria-hidden', 'true');
      document.getElementById('lbImg').src = '';
    }
    document.getElementById('lbClose').onclick = closeLightbox;
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function copyShortlist() {
      const lines = [DATA.title, ''];
      const yes = DATA.applicants.filter(a => picks[a.id]==='yes');
      const maybe = DATA.applicants.filter(a => picks[a.id]==='maybe');
      if (yes.length) {
        lines.push('YES:');
        yes.forEach(a => lines.push('- ' + a.name + (a.rate ? ' (' + a.rate + '/hr)' : '')));
        lines.push('');
      }
      if (maybe.length) {
        lines.push('MAYBE:');
        maybe.forEach(a => lines.push('- ' + a.name + (a.rate ? ' (' + a.rate + '/hr)' : '')));
      }
      const text = lines.join('\n').trim();
      if (!text || (!yes.length && !maybe.length)) {
        showToast('Nothing to copy yet');
        return;
      }
      navigator.clipboard.writeText(text).then(() => showToast('Shortlist copied'));
    }

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
        chip.classList.add('on');
        activeFilter = chip.dataset.filter;
        render();
      });
    });
    document.getElementById('copyBtn').onclick = copyShortlist;
    document.getElementById('clearBtn').onclick = () => {
      if (confirm('Clear all picks?')) {
        picks = {};
        localStorage.removeItem(STORAGE_KEY);
        render();
      }
    };
    render();
  </script>
</body>
